services:
  - type: web
    name: verdant
    runtime: node
    plan: free
    region: singapore
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm --filter @verdant/web run build
    startCommand: pnpm --filter @verdant/server run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB
        value: verdant
      - key: CRON_ENABLED
        value: "true"
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
